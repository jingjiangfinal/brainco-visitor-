<style>
:root{--bg:#f4f7f7;--card:#fff;--ink:#12262c;--mute:#5d7077;--line:#d8e2e4;--brand:#0f6b66;--brand-ink:#fff;--soft:#e3f2f0;--warn:#8a5600;--warnbg:#fdf2dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1719;--card:#152225;--ink:#e6f0f0;--mute:#93a8ad;--line:#27393d;--brand:#3cc2b6;--brand-ink:#062521;--soft:#17332f;--warn:#f0c26b;--warnbg:#32270f}}
:root[data-theme="dark"]{--bg:#0d1719;--card:#152225;--ink:#e6f0f0;--mute:#93a8ad;--line:#27393d;--brand:#3cc2b6;--brand-ink:#062521;--soft:#17332f;--warn:#f0c26b;--warnbg:#32270f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{padding:12px 0 18px}
header h1{margin:0;font-size:26px;line-height:1.3;letter-spacing:.02em}
header p{margin:6px 0 0;color:var(--mute);font-size:15px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
h2{margin:0 0 4px;font-size:21px;line-height:1.4}
.sub{margin:0 0 16px;color:var(--mute);font-size:15px}
ol.rules{margin:0 0 16px;padding-left:22px}
ol.rules li{margin:7px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14.5px;margin:14px 0}
.choice{display:grid;gap:10px;margin:8px 0}
button,.btn{font:inherit;cursor:pointer}
.opt{text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px}
.opt b{display:block;font-size:17px}
.opt span{color:var(--mute);font-size:14px}
.opt:hover,.opt:focus-visible{border-color:var(--brand);outline:none;background:var(--soft)}
.opt.sel{border-color:var(--brand);background:var(--soft)}
.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:12px 22px;font-weight:600;display:inline-block;text-decoration:none}
.primary[disabled]{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px 18px;display:inline-block;text-decoration:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:4px;accent-color:var(--brand)}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.qrs figure{margin:0;text-align:center;font-size:14px;color:var(--mute)}
.qrs img{width:100%;border-radius:8px;border:1px solid var(--line)}
iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:8px 0}
.addr{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.8}
.up{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--mute);margin:10px 0}
.up img{max-width:100%;max-height:260px;border-radius:6px;margin-top:10px}
ul.sum{padding-left:20px}
.back{background:none;border:0;color:var(--mute);padding:8px 0;margin-top:12px}
@media (max-width:480px){.qrs{grid-template-columns:1fr}iframe{height:380px}}
</style>

function qrBlock(){return '<div class="qrs"><figure><img src="'+QR.wx+'" alt="微信收款码">微信</figure><figure><img src="'+QR.ali+'" alt="支付宝收款码">支付宝</figure></div>'}
function shotBlock(){
 return '<div class="up"><label class="ghost" for="f">选择付款截图</label><input id="f" type="file" accept="image/*" hidden><div id="pv">'+(S.shot?'<img src="'+S.shot+'" alt="付款截图预览">':'')+'</div><div style="font-size:13px;margin-top:8px">截图仅在本页预览，不会上传；请把截图发给对接人或发到对接群。</div></div>'
}
function bindShot(){
 var f=$("f");if(!f)return;
 f.onchange=function(){var r=new FileReader();r.onload=function(){S.shot=r.result;$("pv").innerHTML='<img src="'+S.shot+'" alt="付款截图预览">';sum();if(window.upd)window.upd()};if(f.files[0])r.readAsDataURL(f.files[0])}
}
function next(label,id,gate){return '<div class="actions"><button class="primary" '+(gate?'id="nx" disabled':'')+' onclick="go(\''+id+'\')">'+label+'</button></div>'}
function gateOn(box){var b=$(box),n=$("nx");if(b&&n){var f=function(){var id=S.path[S.path.length-1];n.disabled=!(b.checked&&(id!=="c2"||S.inv)&&(id!=="c3"||S.pay&&S.shot))};b.onchange=f;window.upd=f}}
function chk(id,txt){return '<label class="chk"><input type="checkbox" id="'+id+'"><span>'+txt+'</span></label>'}
var V={
notice:function(){return '<h2>参访须知</h2><p class="sub">所有来访客户都需要阅读。</p><ol class="rules">'+NOTICES.map(function(t){return"<li>"+esc(t)+"</li>"}).join("")+'</ol>'+chk("c","我已阅读并同意以上全部须知")+next("继续","invoice",1)},
invoice:function(){return '<h2>是否需要开发票？</h2><p class="sub">选择后，页面会带你走对应的流程。</p><div class="choice"><button class="opt" onclick="S.invoice=false;go(\'payonly\')"><b>不需要发票</b><span>只需提交付款截图，流程到此结束</span></button><button class="opt" onclick="S.invoice=true;go(\'method\')"><b>需要发票</b><span>继续选择支付方式</span></button></div>'},
method:function(){return '<h2>选择支付方式</h2><p class="sub">发票抬头统一为“咨询服务费”，税率 6%。</p><div class="choice"><button class="opt" onclick="S.method=\'wx\';go(\'wx1\')"><b>微信 / 支付宝</b><span>扫码付款，填写代付款协议并盖章</span></button><button class="opt" onclick="S.method=\'corp\';go(\'c1\')"><b>对公支付</b><span>生成合同，签署后银行转账</span></button></div>'},
payonly:function(){return '<h2>付款并提交截图</h2><p class="sub">不开发票，无需合同。扫码付款后，请在参访前提供付款截图。</p>'+qrBlock()+shotBlock()+'<div class="note">收款方：杭州强脑智能有限公司。付款客户名称请与来访单位保持一致。</div>'+next("完成","done")},
wx1:function(){return '<h2>用微信或支付宝付款</h2><p class="sub">请使用单位名称对应的账户或备注单位名称付款。</p>'+qrBlock()+chk("c","我已完成付款")+next("下一步","wx2",1)},
wx2:function(){return '<h2>填写代付款协议并盖章</h2><p class="sub">填写协议，信息确认后，加盖公司公章。</p><div class="actions" style="margin-top:0">'+(AGREEMENT_URL?'<a class="primary" href="'+AGREEMENT_URL+'" target="_blank" rel="noopener">下载代付款协议</a>':'<span class="note" style="margin:0">代付款协议文件请向对接人索取。</span>')+'</div><div class="note">协议信息一旦确认不可更改，请核对后再盖章。</div>'+chk("c","协议已填写并盖章")+next("下一步","wx3",1)},
wx3:function(){return '<h2>发送扫描件并邮寄原件</h2><ol class="rules"><li>先把盖章后的扫描件发到对接群里。</li><li>再把纸质版邮寄到下面的地址。</li></ol><div class="addr">地址：'+esc(CONTACT.addr)+'<br>联系人：'+esc(CONTACT.name)+'<br>电话：<a href="tel:'+CONTACT.tel+'">'+CONTACT.tel+'</a></div><div class="note">参访前请把付款截图也发到群里。</div>'+shotBlock()+chk("c","扫描件已发送，纸质版已寄出")+next("完成","done",1)},
c1:function(){return '<h2>生成合同并发给我们</h2><p class="sub">在下面的页面填写信息，填完后先把合同 Word 下载下来，发给我们核实。</p><iframe src="'+CONTRACT_URL+'" title="合同生成工具" loading="lazy"></iframe><div class="actions" style="margin-top:0"><a class="ghost" href="'+CONTRACT_URL+'" target="_blank" rel="noopener">在新窗口打开合同工具</a></div><div class="note">合同模板修改需要告知更改部分，由我们核实。合同确认后不可更改。</div><p><b>合同签署方式：纸质版</b></p><ol class="rules"><li>打印两份合同并盖章。</li><li>寄给我们，我们盖章后寄回一份。</li><li>寄送地址和电话已写在合同中。</li></ol>'+chk("c","合同 Word 已发给对接人，纸质合同将按上述方式盖章寄出")+next("下一步","c2",1)},
c2:function(){return '<h2>是专票还是普票？</h2><p class="sub">两种发票税率都是 6%，发票抬头只能是“咨询服务费”。</p><div class="choice"><button class="opt" data-k="inv" data-v="专票" onclick="pick(\'inv\',\'专票\')"><b>增值税专用发票（专票）</b></button><button class="opt" data-k="inv" data-v="普票" onclick="pick(\'inv\',\'普票\')"><b>增值税普通发票（普票）</b></button></div><div class="note">合同甲方名称、付款客户名称、发票销售客户名称三者需一致。</div><div class="note">选好后，请把“专票”或“普票”发到对接群里。</div>'+chk("c","已选择发票类型，并已发到群里")+next("下一步","c3",1)},
c3:function(){return '<h2>选择付款方式并提交付款截图</h2><p class="sub">对公转账的银行信息已包含在合同中；选微信或支付宝可扫下方二维码。</p><div class="choice"><button class="opt" data-k="pay" data-v="对公" onclick="pick(\'pay\',\'对公\')"><b>对公转账</b></button><button class="opt" data-k="pay" data-v="支付宝" onclick="pick(\'pay\',\'支付宝\')"><b>支付宝</b></button><button class="opt" data-k="pay" data-v="微信" onclick="pick(\'pay\',\'微信\')"><b>微信</b></button></div>'+qrBlock()+shotBlock()+'<div class="note"><b>请在群里发这三样：</b><div id="gs"></div></div>'+chk("c","三样都已发到群里")+next("完成","done",1)},
done:function(){return '<h2>办理完成</h2><p class="sub">参访前请再确认下列事项：</p><ul class="sum"><li>来访前一天报备车牌号。</li><li>提前告知来访人员名单。</li><li>已发送付款截图。</li><li>参访当天直接到前台，前台会安排参访。</li></ul>'+(S.invoice?'<div class="note">合同、付款条件和发票信息已确认，不可更改。</div>':'')+'<div class="actions"><button class="ghost" onclick="S={invoice:null,method:null,path:[\'notice\'],shot:null};render()">重新开始</button></div>'}
};
function pick(k,v){S[k]=v;document.querySelectorAll('[data-k="'+k+'"]').forEach(function(b){b.classList.toggle("sel",b.dataset.v===v)});sum();if(window.upd)window.upd()}
function sum(){var g=$("gs");if(!g)return;g.innerHTML='<ol class="rules" style="margin:6px 0 0"><li>发票类型：'+(S.inv||"未选择")+'</li><li>付款方式：'+(S.pay||"未选择")+'</li><li>付款截图：'+(S.shot?"已选择，请发图":"未选择")+'</li></ol>'}
function render(){
 var id=S.path[S.path.length-1];
 if(id==="invoice"){S.invoice=null;S.method=null}
 $("view").innerHTML=V[id]();
 gateOn("c");bindShot();sum();
 var n=S.path.length,t=S.invoice===false?4:S.invoice===true?7:0;
 $("pt").textContent=NAMES[id];
 $("pn").textContent=id==="done"?"已完成":(t?"第 "+n+" 步 / 共 "+t+" 步":"第 "+n+" 步");
 $("pb").style.width=(id==="done"?100:t?(n-1)/t*100:(n-1)*8)+"%";
 $("back").hidden=S.path.length<2;
 window.scrollTo(0,0);
}
$("back").onclick=back;
render();
</script>
</body>
</html>
